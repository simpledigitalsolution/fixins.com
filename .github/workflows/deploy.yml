# Deploy to GoDaddy cPanel hosting via FTP
#
# REQUIRED GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    - your FTP hostname, e.g. ftp.fixinsapp.com
#   FTP_USERNAME  - your cPanel FTP username
#   FTP_PASSWORD  - your cPanel FTP password
#
# This workflow assumes the FTP user is rooted at the active web document root.
# For dedicated/chrooted users, keep server-dir as ./

name: Deploy to GoDaddy cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Build static site
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build

      - name: Deploy built site to GoDaddy via FTP
        if: ${{ hashFiles('package.json') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./
          dangerous-clean-slate: false

      - name: Deploy single-file static site to GoDaddy via FTP
        if: ${{ hashFiles('package.json') == '' }}
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          # Patterns are matched with multimatch (matchBase: true, dot: true).
          # A pattern like **/.git* matches the .git entry itself but NOT the
          # files inside it, so the /** twin is required to exclude the tree.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env*
            **/.env*/**
            README.md
          dangerous-clean-slate: false
